<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV BIKE </title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="app">
        <header class="top">
            <div class="logo">⚡</div>
            <button class="language">🌏english</button>

        </header>
        <!--hero section-->
        <section class="hero">
            <div class="hero-text">
                <h1>RIDE<br>FOR<br><span>YOU</span></h1>
                <P class="bike-rental">EV BIKE RENTAL</P>
                <div class="line"></div>
                <p class="tagline">Smart Rides<br>Sustainable Future</p>
            </div>
            <div class="bike-image">
                <img src="./images/Vector 2.png" alt="Electrical-bike">
            </div>
        </section>
        <!--login section-->
        <section class="login-card">
            <h2>Welcome Back</h2>
            <p>Login to continue your journey</p>
            <div class="phone-input">
                <span>+91</span>
                <input type="tel" placeholder="Enter your mobile number">
            </div>
            <button class="otp-button">Continue with Otp
            <span>→</span>
            </button>
            <div class="or-section">
               
                <p>OR</p>
            </div>
            <!--google login-->
            <button class="google-button">
                <span>📧</span>
                Continue With Google

            </button>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <h4>Safe & Security</h4>
                    <p>Your safety is our priority</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚖</div>
                    <h4>100% Electric</h4>
                    <p>Zero Emission Ride</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">⇫</div>
                    <h4>24/7 Support</h4>
                    <p>We are always here to help you</p>
                </div>
            </div>
            <a href="./booking.html" style="text-decoration: none;">
                <button style="background: #00b26f; color:white; padding: 12px;border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-bottom:15px; font-weight:bold;">
                BOOK A RIDE 
            </button>
            </a>
            <div class="create-account">
                <span>New here?</span>
                <a href="#">Create an Account</a>
            </div>
        </section>
    </div>
</body>
</html>
